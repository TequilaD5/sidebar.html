<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details Sidebar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 300px;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
        }
        h3 { margin-bottom: 10px; }
        p { margin: 5px 0; }
    </style>
</head>
<body>
    <h3>Property Details</h3>
    <p><strong>Address:</strong> <span id="property-address">N/A</span></p>
    <p><strong>Owner Name:</strong> <span id="property-owner">N/A</span></p>
    <p><strong>Mailing Address:</strong> <span id="property-mailing">N/A</span></p>
    <p><strong>Phone:</strong> <span id="property-phone">N/A</span></p>
    <p><strong>Email:</strong> <span id="property-email">N/A</span></p>

    <script>
        function updateSidebar(property) {
            document.getElementById("property-address").textContent = property.address || "N/A";
            document.getElementById("property-owner").textContent = property.owner_name || "N/A";
            document.getElementById("property-mailing").textContent = property.mail_address || "N/A";
            document.getElementById("property-phone").textContent = property.phone || "N/A";
            document.getElementById("property-email").textContent = property.email || "N/A";
        }
        window.addEventListener("message", function(event) {
            if (event.data && event.data.property) {
                updateSidebar(event.data.property);
            }
            var sidebarIframe = document.querySelector("iframe");
            if (sidebarIframe) {
                sidebarIframe.contentWindow.postMessage({ property }, "*");
            }
        });
        </script>
    </body>
    </html>
